name: Build

on:
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install TypeScript
      run: npm install -g typescript@5.8.3 # tsconfig uses outFile + module none, removed in TypeScript 6
    - name: Build frontend
      run: tsc
    - name: Build backend
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Prototype: always load fresh source so edits show without a hard refresh. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Shapka — the hat game</title>
  <link rel="icon" type="image/png" href="assets/shapka-logo.png" />
  <!-- Flutter's Icons.* use these glyph sets. -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet" />

  <style>
    /* Wordmark font — the web client's Metal Mania, bundled (OFL) for the app. */
    @font-face {
      font-family: "Metal Mania";
      src: url("assets/fonts/MetalMania-Regular.ttf") format("truetype");
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Light palette — becomes lib/theme.dart kLightPalette. Dark values are
       swapped in by applyTheme() in shapka-app.jsx (kDarkPalette).
       The purple is the web client's #9C27B0 → #7B1FA2 gradient. */
    :root {
      --primary:        #8E24AA;
      --primary-deep:   #6A1B9A;
      --primary-light:  #F3E5F7;
      --on-primary:     #FFFFFF;
      --bg:             #F6F1F8;
      --surface:        #FFFFFF;
      --surface-alt:    #EEE6F2;
      --border:         #E2D6E8;
      --text:           #1C1022;
      --text2:          #4B3D53;
      --text3:          #877A8F;
      --success:        #11883F;
      --success-light:  #DDF6E5;
      --danger:         #C62842;
      --danger-light:   #FDE6E9;
      --warning:        #E07B00;
      --gold:           #E2A915;
      --silver:         #98A2AB;
      --bronze:         #C9733A;
      --stage:          #2A0F33;
      --stage-2:        #4A1559;
      --card-shadow:    0 10px 30px -14px rgba(74, 21, 89, .35);
    }

    /* The app uses the platform font (SF Pro / Roboto); Metal Mania is wordmark only. */
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Roboto", system-ui, sans-serif;
      height: 100%;
      background: #160a1b;
      -webkit-font-smoothing: antialiased;
      line-height: 1.2;
    }
    #root { height: 100%; }
    button, input { font-family: inherit; color: inherit; }
    input::placeholder { color: var(--text3); }
    .big-input::placeholder { font-size: 22px; font-weight: 600; letter-spacing: 0; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    .mi { font-family: "Material Icons"; }
    .mi-outlined { font-family: "Material Icons Outlined"; }
    .mi-round { font-family: "Material Icons Round"; }
    .mi, .mi-outlined, .mi-round {
      font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal;
      text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
      -webkit-font-feature-settings: "liga"; font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased; flex-shrink: 0; user-select: none;
    }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── Motion ───────────────────────────────────────────────────────── */
    @keyframes ctaGlow {
      0%, 100% { box-shadow: 0 0 6px 0 var(--g-color); }
      50%      { box-shadow: 0 0 22px 6px var(--g-color); }
    }
    @keyframes hatBob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-6px) rotate(3deg); }
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(.86) translateY(10px); }
      70%  { opacity: 1; transform: scale(1.03) translateY(0); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    /* Guessed word flies into the team's score. */
    @keyframes flyOut {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(.6); }
    }
    @keyframes scoreBump { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.35); } }
    /* Last ten seconds: the ring and digits pulse once per second. */
    @keyframes urgent { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.06); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes ring {
      0%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(-14deg); } 20%, 40% { transform: rotate(14deg); } 50% { transform: rotate(0); }
    }
    @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0); opacity: 1; }
      100% { transform: translateY(760px) rotate(540deg); opacity: 0; }
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    #phone-app-root button:focus-visible, #phone-app-root [role="button"]:focus-visible, #phone-app-root input:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Game rules: plain JS port of the Rust server, also run by tools/*.test.cjs -->
  <script src="shapka-game.js"></script>
  <script src="shapka-sample.js"></script>

  <!-- React components (Babel JSX) — order matters -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shapka-components.jsx"></script>
  <script type="text/babel" src="shapka-lobby.jsx"></script>
  <script type="text/babel" src="shapka-play.jsx"></script>
  <script type="text/babel" src="shapka-app.jsx"></script>
</body>
</html>
